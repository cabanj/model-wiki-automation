# Origin-lock classification. Generated by deploy/update-cloudflare-ranges.sh;
# do not hand-edit.
#
# WHY geo AND NOT map: a `map` block matches EXACT values only. Keyed on an
# address it never matches 172.69.155.12 against the entry 172.64.0.0/13, so
# every real Cloudflare edge fell through to `default 0` and the lock answered
# 403 for the entire internet. `geo` is the directive that understands CIDR
# networks, so it is the only thing that can express this allowlist. Verified
# with a probe log, not assumed.
#
# KEYED ON $realip_remote_addr: the peer address BEFORE real_ip_header rewrites
# it, i.e. the Cloudflare edge that actually connected. $remote_addr would be the
# visitor, because real_ip_header CF-Connecting-IP restores it, and allowlisting
# the visitor is as broken as allowlisting the edge by the wrong name.
#
# `default 0` makes it fail CLOSED: an address Cloudflare has not published is
# refused. If Cloudflare adds a range, real traffic is refused until
# deploy/update-cloudflare-ranges.sh is re-run. Visible breakage beats silent
# exposure, and the generator refuses to write an empty list.
#
# Order is irrelevant: every entry sets the same value. Regenerated together with
# cloudflare-realip.conf so the trust list and this lock cannot drift apart.
geo $realip_remote_addr $origin_lock_allowed {
    default 0;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    108.162.192.0/18 1;
    131.0.72.0/22 1;
    141.101.64.0/18 1;
    162.158.0.0/15 1;
    172.64.0.0/13 1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    2400:cb00::/32 1;
    2405:8100::/32 1;
    2405:b500::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    127.0.0.1/32 1;
    ::1/128 1;
}
