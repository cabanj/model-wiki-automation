# Cloudflare-only access to the wiki origin.
#
# WHY: llmroster.dev is served through Cloudflare, but the origin's :80 was
# reachable directly. That bypasses Cloudflare's TLS, its WAF, and its rate
# limiting, and the access log showed foreign IPs doing exactly that. Anyone
# who learned the origin IP could also poison the per-client rate limit, because
# they would appear as their own address.
#
# SCOPE — deliberately narrow. Only the :80 default_server that serves
# llmroster.dev is locked:
#   * :443 is the LiteLLM router, reached directly via sslip.io and NOT behind
#     Cloudflare. Locking it would break the router.
#   * :8080 is the localhost smoke-test vhost used by run.sh / deploy-only.sh.
#   * The watchdog resolves 135-125-233-237.sslip.io to 127.0.0.1, so it never
#     touches :80.
# Loopback is allowed because local tooling and the deploy scripts do hit the
# origin directly, and 127.0.0.1 is not an attack surface.
#
# MECHANISM: an allowlist is used rather than a denylist. A denylist of known
# bad actors can never be complete; an allowlist of Cloudflare's published
# ranges fails closed. If Cloudflare adds a range and this file is not
# regenerated, traffic is refused — visible and fixable, rather than silently
# open. `deploy/update-cloudflare-ranges.sh` regenerates it.
#
# WHY NOT A PLAIN `allow` LIST — this is the trap that bit us:
# `allow` matches $remote_addr, and `real_ip_header CF-Connecting-IP` REWRITES
# that to the real visitor's address. An allowlist of Cloudflare ranges tested
# against $remote_addr therefore refuses every real visitor: the lock worked
# perfectly and locked out the entire internet (403 on all pages).
#
# $realip_remote_addr is the address before the rewrite — the Cloudflare edge
# that actually connected. That is the value that must be tested. `allow`
# cannot take a variable, so the address is classified in the http context by
# `geo` in conf.d (generated by deploy/update-cloudflare-ranges.sh) and this
# block only reads the result: $origin_lock_allowed is 1 for loopback or a Cloudflare edge, and 0
# for anything else. The classification fails CLOSED.
if ($origin_lock_allowed = 0) {
    # 403 rather than 444: a distinct status makes the cause obvious in the
    # access log instead of looking like a silent drop.
    return 403;
}