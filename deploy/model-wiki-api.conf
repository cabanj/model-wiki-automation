# Public API vhost fragment for llmroster.dev
#
# This file is a DROP-IN for the site vhost: install it as the site's nginx
# config to expose /api/ with a rate limit and permissive CORS. It is kept
# separate from the site vhost so the API policy can change without touching
# the page config, and so a rollback is one `ln -sf` away.
#
# Requires (http context, i.e. /etc/nginx/conf.d/):
#   roster-api-limit.conf      -> limit_req_zone $binary_remote_addr zone=roster_api
#   cloudflare-realip.conf     -> real_ip_header CF-Connecting-IP + set_real_ip_from
#
# The origin on :80 is reachable directly, bypassing Cloudflare. That is why
# real-IP restoration matters: without it, $remote_addr is the Cloudflare edge
# for proxied traffic and the zone counts every visitor as one address. Direct
# (non-proxied) requests still carry their true address and are limited normally.

server {
    listen 8080;
    server_name _;

    root /var/www/model-wiki;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        add_header X-Content-Type-Options 'nosniff';
    }

    # Public JSON API. Anonymous and read-only by design: the payload is
    # derived from the same data as the site, so it leaks nothing that is not
    # already on the page.
    location /api/ {
        # Static file with no side effects, so a short shared-cache window is
        # safe and keeps the origin idle. `must-revalidate` still revalidates
        # once stale, which is when the daily deploy becomes visible.
        add_header Cache-Control 'public, max-age=300, must-revalidate' always;
        add_header Access-Control-Allow-Origin '*' always;
        add_header X-Content-Type-Options 'nosniff' always;
        # Advertise the schema version so a client can branch on it without
        # parsing the body, and expose it for cross-origin JS readers.
        add_header Access-Control-Expose-Headers 'ETag, Last-Modified' always;

        limit_req zone=roster_api burst=60 nodelay;
        # 503 rather than the default 429: nginx's 429 is indistinguishable
        # from a Cloudflare rate-limit page for API clients parsing status.
        limit_req_status 503;

        # .json must be served as JSON, not sniffed or defaulted to octet-stream.
        types { application/json json; }
        default_type application/json;

        # `no-cache` on the file itself: revalidate every time so a deploy
        # takes effect immediately; `burst=60 nodelay` absorbs bursty pollers.
        try_files $uri =404;
    }

    access_log /var/log/nginx/model-wiki-access.log;
    error_log  /var/log/nginx/model-wiki-error.log;
}
