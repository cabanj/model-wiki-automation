# Public API rate limiting for llmroster.dev
#
# Zone lives in conf.d because limit_req_zone is only valid in the http context.
# The key is $binary_remote_addr, which is only the real client IP if the
# Cloudflare real-IP rewrite is installed (see cloudflare-realip.conf). Without
# it every proxied request shares a handful of Cloudflare edge addresses and the
# limit either blocks everyone or no one.

# Read traffic on the roster feed. Static JSON behind Cloudflare's cache, so
# this is a safety net against hammering the origin, not a quota.
limit_req_zone $binary_remote_addr zone=roster_api:10m rate=30r/m;
