# Public JSON API for llmroster.dev. Split into a snippet because the same
# block has to live in every vhost that can serve the domain: the origin's
# :80 default_server answers llmroster.dev today, but a future vhost that
# claims the name would otherwise serve the API without a rate limit.
#
# Keys on $binary_remote_addr, which is the real client only because
# conf.d/cloudflare-realip.conf restores it from CF-Connecting-IP. The origin
# is also reachable directly on :80, and those requests carry a true address,
# so they are limited correctly too.
location /api/ {
    add_header Cache-Control 'public, max-age=300, must-revalidate' always;
    add_header Access-Control-Allow-Origin '*' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header Access-Control-Expose-Headers 'ETag, Last-Modified' always;

    limit_req zone=roster_api burst=60 nodelay;
    # 503, not nginx's default 429: a 429 here is indistinguishable from a
    # Cloudflare rate-limit page for a client parsing status codes.
    limit_req_status 503;

    types { application/json json; }
    default_type application/json;
    try_files $uri =404;
}