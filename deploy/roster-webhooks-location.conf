# Subscription API: proxy to the webhook service on loopback.
#
# Only the subscription routes are exposed. Two deliberate exclusions:
#   /api/v1/health    stays loopback-only. It reports subscription and queue
#                     counts, which is operational information, not public API.
#   /api/v1/dispatch  stays loopback-only. It forces a delivery pass and must
#                     never be reachable from the internet.
#
# nginx picks the LONGEST matching prefix, so these blocks win over the
# `location /api/` static-file block for the subscription paths even though
# /api/v1/subscriptions is under it. That ordering is the whole reason the
# static block can stay as a single catch-all for the roster payload.

location = /api/v1/subscriptions {
    limit_req zone=roster_subs burst=10 nodelay;
    # 503, not 429: consistent with the read zone so a client has one rule.
    limit_req_status 503;

    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The service is bound to loopback, so the socket peer is always nginx and
    # X-Real-IP is the only trustworthy client identity. It uses this for the
    # per-IP subscription cap, so forwarding it correctly is load-bearing.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # The ownership challenge waits up to 2 x 5s server-side, so the default
    # 60s read timeout is generous already; this states the expectation rather
    # than relying on the default.
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Registration is not idempotent: a retried POST would create a second
    # subscription. The service dedupes on event id, not on registration, so
    # the client must see the real answer rather than a replayed one.
    proxy_buffering off;
}

# DELETE /api/v1/subscriptions/<id>. Slightly looser: removal is local and
# cheap, and an operator deleting a few in a row should not hit the ceiling.
location ^~ /api/v1/subscriptions/ {
    limit_req zone=roster_subs burst=20 nodelay;
    limit_req_status 503;

    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
